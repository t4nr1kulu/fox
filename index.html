<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Operation Phantom Fox</title>
<style>
body{background-color:#1e1e1e;color:#d4d4d4;font-family:'Courier New',Courier,monospace;padding:20px;margin:0;overflow-x:hidden}
.container{max-width:800px;margin:0 auto}
.keyword{color:#569cd6;font-weight:bold}
.string{color:#ce9178}
.comment{color:#6a9955;font-style:italic}
.function{color:#dcdcaa}
#typewriter{white-space:pre-wrap;font-size:16px;line-height:1.5}
.cursor{display:inline-block;width:8px;height:18px;background-color:#d4d4d4;animation:blink 1s step-end infinite;vertical-align:text-bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div class="container"><div id="typewriter"></div><span class="cursor"></span></div>
<script>
const codeLines = [
    '<span class="comment"># Sistem başlatılıyor...</span>',
    '<span class="keyword">print</span>(<span class="string">"Hello World"</span>)',
    '<span class="keyword">print</span>(<span class="string">"Status: ACTIVE"</span>)',
    '',
    '<span class="comment"># --- YBS Kulübü Sistem Güncellemesi ---</span>',
    '<span class="comment"># Yeni bir vizyon yükleniyor...</span>',
    '<span class="comment"># Hedef: Tüm dönemleri kapsayan tam entegre bir kulüp deneyimi.</span>',
    '',
    '<span class="keyword">import</span> yenilik',
    '<span class="keyword">from</span> ethem_ekibi <span class="keyword">import</span> dinamizm, projeler, kapsayicilik',
    '',
    '<span class="keyword">def</span> <span class="function">sistemi_yenile</span>():',
    '    hedef_kitle = [<span class="string">"Hazırlık"</span>, <span class="string">"1. Sınıflar"</span>, <span class="string">"2. Sınıflar"</span>, <span class="string">"3. ve 4. Sınıflar"</span>]',
    '    <span class="keyword">print</span>(<span class="string">"Tüm sınıflar için ortak çalışma modülleri aktif ediliyor..."</span>)',
    '',
    '    <span class="keyword">for</span> ogrenci <span class="keyword">in</span> hedef_kitle:',
    '        <span class="keyword">if</span> ogrenci == <span class="string">"Hazırlık"</span>:',
    '            <span class="keyword">print</span>(<span class="string">f"[{ogrenci}] sınıfı algılandı: Mentörlük Sistemi (YBS Buddy) başlatılıyor... %100"</span>)',
    '        <span class="keyword">else</span>:',
    '            <span class="keyword">print</span>(<span class="string">f"[{ogrenci}] sınıfı algılandı: Yeni nesil projeler entegre ediliyor... %100"</span>)',
    '',
    '<span class="keyword">if</span> vizyon == <span class="string">"Gelecek Biziz"</span>:',
    '    sistemi_yenile()',
    '    <span class="keyword">print</span>(<span class="string">"Sistem Güncellendi. YBS v2.0 Başarıyla Kuruldu."</span>)',
    '',
    '<span class="comment"># Motto: Live for Management, Die for Information</span>',
    '<span class="keyword">print</span>(<span class="string">"Ethem\'in sana ihtiyacı var!"</span>)'
];

const typewriterElement = document.getElementById('typewriter');
let currentLine = 0;
let currentChar = 0;
let isTag = false;
let tagContent = '';
let currentHTML = ''; 

function typeWriter() {
    if (currentLine < codeLines.length) {
        const line = codeLines[currentLine];
        
        if (currentChar < line.length) {
            const char = line.charAt(currentChar);
            
            if (char === '<') {
                isTag = true;
                tagContent += char;
                currentChar++;
                typeWriter();
                return;
            }
            
            if (isTag) {
                tagContent += char;
                if (char === '>') {
                    isTag = false;
                    currentHTML += tagContent;
                    typewriterElement.innerHTML = currentHTML;
                    tagContent = '';
                }
                currentChar++;
                typeWriter();
                return;
            }

            currentHTML += char;
            typewriterElement.innerHTML = currentHTML;
            currentChar++;
            
            // HIZLANDIRMA 1: Harf yazım hızı artırıldı (Eski: 50+20, Yeni: 15+5)
            let delay = Math.random() * 15 + 5; 
            // HIZLANDIRMA 2: Noktalama işaretlerindeki bekleme azaltıldı (Eski: 300, Yeni: 50)
            if (char === '.' || char === ':') delay += 50; 
            
            setTimeout(typeWriter, delay);
        } else {
            currentHTML += '<br>';
            typewriterElement.innerHTML = currentHTML;
            currentLine++;
            currentChar = 0;
            // HIZLANDIRMA 3: Alt satıra geçiş hızı artırıldı (Eski: 400, Yeni: 100)
            setTimeout(typeWriter, 100);
        }
    }
}
// HIZLANDIRMA 4: Siteye girildiğinde animasyonun başlama süresi sıfırlandı (Eski: 1000ms, Yeni: 50ms)
setTimeout(typeWriter, 50);
</script>
</body>
</html>
